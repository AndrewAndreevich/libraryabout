<!doctype html>
<html><head><meta charset="utf-8"></head>
<body><pre id="log">idle</pre>
<script type="module">
const log = (m) => { document.getElementById('log').textContent = m; window.__log = m; };
window.__done = false; window.__err = null; window.__mind = null;
async function run() {
  try {
    log('importing mind-ar compiler…');
    const mod = await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js');
    const Compiler = mod.Compiler || (window.MINDAR && window.MINDAR.IMAGE && window.MINDAR.IMAGE.Compiler);
    if (!Compiler) { window.__err = 'no Compiler export; keys=' + Object.keys(mod).join(','); log(window.__err); return; }
    log('loading target image…');
    const img = new Image(); img.crossOrigin = 'anonymous'; img.src = '/svaneti/models/ushba_tex.jpg';
    await img.decode();
    log('compiling… (this can take a while)');
    const compiler = new Compiler();
    await compiler.compileImageTargets([img], (p) => { log('compiling ' + p.toFixed(1) + '%'); });
    const buf = await compiler.exportData();
    const bytes = new Uint8Array(buf);
    let bin = ''; const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    window.__mind = btoa(bin);
    window.__done = true;
    log('DONE bytes=' + bytes.length + ' b64len=' + window.__mind.length);
  } catch (e) { window.__err = String(e && e.stack || e); log('ERR ' + window.__err); }
}
window.__run = run;
run();
</script></body></html>
