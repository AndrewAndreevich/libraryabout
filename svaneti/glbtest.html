<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#2a2e36}#i{position:fixed;top:8px;left:8px;color:#fff;font:13px monospace;white-space:pre;z-index:2}</style></head>
<body><div id="i">loading…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const info=document.getElementById('i');
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(devicePixelRatio);R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x2a2e36);
const pmrem=new THREE.PMREMGenerator(R);scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.AmbientLight(0xffffff,0.5));
const k=new THREE.DirectionalLight(0xffffff,2.2);k.position.set(3,5,2);scene.add(k);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.01,100);
const ctr=new OrbitControls(cam,R.domElement);ctr.autoRotate=true;ctr.autoRotateSpeed=2.5;
new GLTFLoader().load('/svaneti/models/ushba.glb',async(g)=>{
  const m=g.scene;
  const tex=await new THREE.TextureLoader().loadAsync('/svaneti/models/ushba_tex.jpg');
  tex.flipY=false; tex.colorSpace=THREE.SRGBColorSpace;
  m.traverse(o=>{ if(o.isMesh){ o.material=new THREE.MeshStandardMaterial({map:tex,roughness:0.95,metalness:0}); }});
  const box=new THREE.Box3().setFromObject(m);const s=box.getSize(new THREE.Vector3());const c=box.getCenter(new THREE.Vector3());
  const md=Math.max(s.x,s.y,s.z);m.position.sub(c);scene.add(m);
  cam.position.set(0,s.y*0.15,md*1.6);ctr.target.set(0,0,0);ctr.update();
  info.textContent='OK external tex + MeshStandard';
},undefined,(e)=>{info.textContent='ERR '+e;});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop);ctr.update();R.render(scene,cam);})();
</script></body></html>
