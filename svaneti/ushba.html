<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Ushba Mountain AR</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #app { position: fixed; inset: 0; }
      #app canvas { position: absolute; top: 0; left: 0; }
      .hud {
        position: fixed; font: 12px/1.5 monospace; color: #cfd2dc;
        background: rgba(20, 20, 26, 0.75); border: 1px solid #44545a;
        border-radius: 4px; padding: 6px 10px; user-select: none; z-index: 20;
        box-sizing: border-box;
      }
      #arStatus { top: 10px; left: 10px; right: 10px; text-align: center; }
      #arDebug { top: 40px; left: 10px; right: 10px; text-align: center; font-size: 10px; color: #ffd479; }
      #arBack { bottom: 10px; left: 10px; cursor: pointer; text-decoration: none; display: inline-block; }
      #arBack:hover { background: rgba(50, 50, 66, 0.9); }
      #arScale {
        bottom: 10px; right: 10px; display: flex; align-items: center; gap: 6px;
      }
      #arScale button {
        width: 26px; height: 26px; font: 14px monospace; color: #cfd2dc;
        background: rgba(255,255,255,0.08); border: 1px solid #44545a; border-radius: 3px;
        cursor: pointer;
      }
      #arScale button:hover { background: rgba(255,255,255,0.18); }
      #arRotate { bottom: 10px; left: 10px; display: flex; flex-direction: column; gap: 3px; }
      #arRotate .rsec { color: #ffd479; font-size: 10px; margin-top: 2px; }
      #arRotate .rrow { display: flex; align-items: center; gap: 4px; }
      #arRotate .rrow > span:first-child { width: 12px; text-align: center; color: #ffd479; }
      #arRotate .rrow .rval, #arRotate .rrow .pval { width: 46px; text-align: center; color: #cfd2dc; font-weight: bold; }
      #arRotate button {
        width: 24px; height: 20px; font: 13px monospace; color: #cfd2dc;
        background: rgba(255,255,255,0.08); border: 1px solid #44545a; border-radius: 3px;
        cursor: pointer; padding: 0; touch-action: none; user-select: none;
      }
      #arRotate button:hover { background: rgba(255,255,255,0.18); }
      #arRotate #rotReset, #arRotate #gridToggle { width: auto; padding: 2px 6px; }
      #arRotate #gridToggle.on { background: rgba(0,255,204,0.25); border-color: #00ffcc; }
      #markerHint {
        position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 4px;
      }
      #markerHint img { width: 72px; height: 72px; border: 2px solid #cfd2dc; background: #fff; }
    </style>
    <script type="module" crossorigin src="/svaneti/assets/ar-B47pU14z.js"></script>
    <link rel="modulepreload" crossorigin href="/svaneti/assets/consoleOverlay-D2NSUDVu.js">
  </head>
  <body>
    <div id="app"></div>
    <div id="arStatus" class="hud">loading AR…</div>
    <div id="arDebug" class="hud"></div>
    <div id="arScale" class="hud">
      <button id="scaleDown">−</button>
      scale
      <button id="scaleUp">+</button>
    </div>
    <div id="arRotate" class="hud">
      <div class="rsec">rotate°</div>
      <div class="rrow"><span>X</span><button data-ax="x" data-d="-1">−</button><span class="rval" data-rv="x">0°</span><button data-ax="x" data-d="1">+</button></div>
      <div class="rrow"><span>Y</span><button data-ax="y" data-d="-1">−</button><span class="rval" data-rv="y">0°</span><button data-ax="y" data-d="1">+</button></div>
      <div class="rrow"><span>Z</span><button data-ax="z" data-d="-1">−</button><span class="rval" data-rv="z">0°</span><button data-ax="z" data-d="1">+</button></div>
      <div class="rsec">move</div>
      <div class="rrow"><span>X</span><button data-pax="x" data-pd="-1">−</button><span class="pval" data-pv="x">0</span><button data-pax="x" data-pd="1">+</button></div>
      <div class="rrow"><span>Y</span><button data-pax="y" data-pd="-1">−</button><span class="pval" data-pv="y">0</span><button data-pax="y" data-pd="1">+</button></div>
      <div class="rrow"><span>Z</span><button data-pax="z" data-pd="-1">−</button><span class="pval" data-pv="z">0</span><button data-pax="z" data-pd="1">+</button></div>
      <div class="rrow" style="gap:6px;margin-top:2px;"><button id="rotReset">reset</button><button id="gridToggle">grid</button></div>
    </div>
    <div id="markerHint">
      <img src="/svaneti/ar/ushba-marker.png?v=barcode" alt="Ushba barcode marker" />
      <span class="hud" style="padding:3px 8px;">point camera here</span>
    </div>
  </body>
</html>
